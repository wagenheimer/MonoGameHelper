name: Build & test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Wagenheimer.MonoGameHelper.slnx
      - name: Build
        run: dotnet build Wagenheimer.MonoGameHelper.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Wagenheimer.MonoGameHelper.slnx -c Release --no-build