name: Bug report
description: Something is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Include your OS, .NET SDK version and reproduction steps.
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Clone / install
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: dotnet
    attributes:
      label: .NET SDK version
      description: Output of `dotnet --version`.
      placeholder: "10.0.100"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project or package version
      description: Git tag, commit or NuGet package version.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Additional context